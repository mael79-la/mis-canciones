<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión — Mi Biblioteca Musical</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d0820;
      color: #e8e0ff;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 2rem;
    }

    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.95); }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #c084fc;
      margin-bottom: 0.75rem;
    }

    p {
      color: #a78bbd;
      font-size: 0.95rem;
      line-height: 1.6;
      max-width: 320px;
      margin-bottom: 2rem;
    }

    button {
      background: linear-gradient(135deg, #7c3aed, #c084fc);
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="icon">🎵</div>
  <h1>Sin conexión</h1>
  <p>
    No hay conexión a internet. Cuando vuelvas a conectarte, 
    podrás escuchar y descargar tus canciones favoritas.
  </p>
  <button onclick="location.reload()">Reintentar</button>
</body>
</html>
